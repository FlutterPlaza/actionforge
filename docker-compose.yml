# ============================================================================
#  ActionForge — Self-Hosted GitHub Actions Runners
#  A FlutterPlaza Open-Source Product | https://flutterplaza.com
# ============================================================================
#  Usage:
#    docker compose up -d --scale runner=4    # start 4 runners
#    docker compose ps                        # check status
#    docker compose logs -f                   # watch logs
#    docker compose down                      # stop all
# ============================================================================

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - GH_ORG=${GH_ORG}
      - GH_REPO=${GH_REPO:-}
      - GH_PAT=${GH_PAT}
      - RUNNER_LABELS=${RUNNER_LABELS:-ubuntu-latest,ubuntu-22.04,ubuntu-24.04,self-hosted,linux,x64}
      - MAX_RETRIES=${MAX_RETRIES:-5}
      - FAIL_COOLDOWN=${FAIL_COOLDOWN:-300}
    restart: unless-stopped
    # Wait up to 6h for a running job to finish before force-killing.
    # Default is 10s — far too short for CI jobs. After SIGTERM, the runner
    # finishes its current job, then exits. Docker sends SIGKILL only after
    # this grace period expires.
    stop_grace_period: 6h
    # Mount Docker socket if your CI workflows build Docker images
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Resource limits per runner (adjust to your machine)
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 1G
