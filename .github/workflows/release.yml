# ============================================================================
#  ActionForge — Release Workflow
#  Creates a GitHub Release and computes SHA256 for Homebrew formula updates
# ============================================================================
#  Usage:
#    git tag v1.0.0 && git push origin v1.0.0
# ============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Compute SHA256 of source tarball
        id: sha256
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          echo "Downloading ${TARBALL_URL}..."
          curl -sL -o source.tar.gz "$TARBALL_URL"
          SHA=$(shasum -a 256 source.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${SHA}"

      - name: Print formula update instructions
        run: |
          TAG="${{ steps.sha256.outputs.tag }}"
          SHA="${{ steps.sha256.outputs.sha256 }}"
          echo ""
          echo "========================================="
          echo "  Update Homebrew formula with:"
          echo "========================================="
          echo "  url: https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          echo "  sha256: ${SHA}"
          echo "========================================="
